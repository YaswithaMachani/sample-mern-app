name: MERN Application CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx (for multi-stage builds)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Test Backend Docker Build
    - name: Build Backend Docker Image
      run: |
        docker build -t sample-mern-backend ./backend

    # 4. Test Frontend Nginx Docker Build
    - name: Build Frontend Docker Image
      run: |
        docker build -t sample-mern-frontend ./frontend

    # 5. Verify Docker Compose setup
    - name: Verify Docker Compose Build
      run: |
        docker compose build
