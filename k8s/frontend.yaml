# 1. React Frontend Deployment (Runs 2 Pod replicas of Nginx React App)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sample-mern-app-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
# 2. React Frontend Service (Exposes application on localhost:30001)
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
