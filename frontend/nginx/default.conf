server {
    # Listen on port 80 inside the Nginx container
    listen 80;
    server_name localhost;

    # Root directory where compiled React static files will live
    root /usr/share/nginx/html;
    index index.html;

    # 1. Frontend Route Handling
    # Serves static files (JS, CSS, images). If a URL is not found (e.g. /dashboard),
    # fallback to index.html so React Router handles page navigation smoothly!
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy for Backend API
    # Any request starting with /api/ is automatically forwarded to the Express container!
    location /api/ {
        # 'backend' is the service name of our Node container in docker-compose.yml!
        proxy_pass http://backend:5000;
        
        # Standard HTTP headers for proper proxying
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
